# Gradle / AGP project settings.
#
# This file was missing entirely, which would have failed the build as soon as
# it got past plugin resolution: AGP requires android.useAndroidX when the
# project depends on androidx artifacts, and this one depends on them heavily.

# Required: this project uses AndroidX (Compose, lifecycle, activity, core-ktx).
android.useAndroidX=true

# R classes contain only the resources declared in their own module.
# Default since AGP 8, stated explicitly so the behaviour is obvious.
android.nonTransitiveRClass=true

# Compose builds are memory-hungry; the default heap is not enough on CI runners.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true

# AGP 9 enables built-in Kotlin support by default, which makes applying
# org.jetbrains.kotlin.android a fatal error. This project still applies KGP
# explicitly (together with the Compose compiler plugin, which is versioned in
# lockstep with Kotlin), so opt out of the new default for now.
#
# Migrating to built-in Kotlin is a worthwhile follow-up, but it should be done
# by someone who can run Gradle locally to confirm how the Compose plugin and
# the bundled KGP version interact - guessing at it from CI round-trips is not
# a good trade.
# See https://developer.android.com/build/migrate-to-built-in-kotlin
android.builtInKotlin=false
