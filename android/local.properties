# Local development settings - committed on purpose.
#
# Normally this file is gitignored, because Android Studio uses it to record
# `sdk.dir`, which is a path on one particular machine. That line is
# deliberately absent here, which is what makes the rest of the file safe to
# share: everything below is about which server the app talks to, and that is
# a property of the setup, not of your laptop.
#
# The SDK path is supplied instead by Android Studio (which knows it) or by the
# ANDROID_HOME environment variable (for terminal builds). See
# ANDROID_STUDIO.md section 3 if a terminal build reports "SDK location not
# found".
#
# If Studio does append an `sdk.dir` line here and you would rather not see it
# in `git status` every time, tell git to stop tracking your local edits:
#
#     git update-index --skip-worktree android/local.properties
#
# Values here are overridden by -P on the command line and by
# gradle.properties, so a release build always wins over anything below.


# ---------------------------------------------------------------------------
# Debug builds - where the app looks for the Pi server
# ---------------------------------------------------------------------------
# 10.0.2.2 is the Android emulator's fixed alias for the host machine's
# loopback, so this pairs with the container that `./gradlew devUp` starts.
# Cleartext HTTP to it is permitted by network_security_config.xml, so a debug
# build works with no further setup.
kidsGalaxyDebugServerHost=10.0.2.2

# On a PHYSICAL tablet, 10.0.2.2 means nothing - the tablet is a separate
# device. Comment the line above, uncomment this one, and use the LAN address
# of the machine running the server.
#kidsGalaxyDebugServerHost=192.168.1.50


# ---------------------------------------------------------------------------
# Release builds - production, for reference
# ---------------------------------------------------------------------------
# Listed here so the deployed values are visible next to the debug ones, but
# left commented: a release build must never inherit whatever happens to be in
# a developer's working copy. Pass them explicitly instead.
#
#   cd pi-server/certs
#   SERVER_IP=10.42.0.1 ./generate_certs.sh
#   cp client.p12 ca.crt ../../android/app/src/main/assets/
#   cd ../../android
#   ./gradlew assembleRelease \
#       -PkidsGalaxyServerHost=10.42.0.1 \
#       -PkidsGalaxyCertPassword=<the install-time password>
#
# kidsGalaxyServerHost defaults to 10.42.0.1 (the Pi hotspot) already; the
# certificate password has no safe default and a release built without it is
# signed with a placeholder that will not open the keystore in the field.
#
#kidsGalaxyServerHost=10.42.0.1
#kidsGalaxyCertPassword=


# ---------------------------------------------------------------------------
# Ports - rarely changed, listed so you know they are overridable
# ---------------------------------------------------------------------------
#kidsGalaxyHttpPort=8000
#kidsGalaxyHttpsPort=8443
