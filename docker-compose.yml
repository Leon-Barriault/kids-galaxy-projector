# Kids Galaxy Projector – local development stack
# Run the entire server side without any Raspberry Pi or projector hardware.
#
# Usage:
#   docker compose up --build
#
# On the Pi, add the override so tablets can discover this galaxy:
#   docker compose -f docker-compose.yml -f docker-compose.pi.yml up -d
#   Server: http://localhost:8000
#   Health: http://localhost:8000/health

services:
  pi-server:
    build:
      context: ./pi-server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./pi-server/uploads:/app/uploads
      - ./pi-server/state:/app/state
      - ./pi-server/static:/app/static:ro
      # Mount certs for optional mTLS development
      - ./pi-server/certs:/app/certs:ro
    environment:
      - ENVIRONMENT=development
      - UPLOAD_DIR=/app/uploads
      - STATE_DIR=/app/state
      - MAX_FILE_SIZE=5242880
      - MAX_STORED_PLANETS=${MAX_STORED_PLANETS:-30}
      - RATE_LIMIT_SECONDS=${RATE_LIMIT_SECONDS:-3}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - GALAXY_NAME=${GALAXY_NAME:-Kids Galaxy}
      # Bridged Docker cannot normally advertise mDNS to the LAN; the Pi
      # override switches to host networking for real discovery.
      - ADVERTISE=${ADVERTISE:-true}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  projector-mock:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./pi-server/static:/usr/share/nginx/html:ro
    depends_on:
      - pi-server
    profiles:
      - full
