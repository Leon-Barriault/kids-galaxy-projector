# Continuous Integration – Kids Galaxy Projector
# Follows SDLC Test Phase principles:
# - Unit and integration suites run on every push / PR
# - A red pipeline blocks merge / release
# - Coverage is reported

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  python-tests:
    name: Python unit + integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pi-server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pi-server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: pi-server/coverage.xml
          fail_ci_if_error: false

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build pi-server image
        run: docker build -t kids-galaxy-pi-server ./pi-server

  android-lint:
    name: Android lint (placeholder)
    runs-on: ubuntu-latest
    # Full Android build requires more setup (SDK, etc.).
    # This job documents the intent; expand when Android CI is fully wired.
    steps:
      - uses: actions/checkout@v4
      - name: Check Android sources present
        run: |
          test -f android/app/src/main/kotlin/com/kidsgalaxy/MainActivity.kt
          echo "Android sources present. Full Gradle CI can be added later."
