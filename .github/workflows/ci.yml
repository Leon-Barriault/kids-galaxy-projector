# Continuous Integration - Kids Galaxy Projector
# Follows SDLC Test Phase principles:
# - Lint every application layer (Python, Docker, shell, Android/Kotlin)
# - Distinct unit and integration suites
# - A red pipeline blocks merge / release
# - Coverage is reported and enforced
# - Docker image must build cleanly (production deps only)

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHONPATH: ${{ github.workspace }}/pi-server

jobs:
  lint:
    name: Lint (all layers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python lint tools
        run: pip install "ruff==0.12.0"

      - name: Lint Python (pi-server)
        working-directory: pi-server
        run: ruff check . --config ruff.toml

      - name: Install hadolint
        run: |
          curl -sL https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 \
            -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint

      - name: Lint Dockerfile
        run: hadolint --config .hadolint.yaml pi-server/Dockerfile

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Lint shell scripts
        run: |
          shellcheck -x scripts/setup_hotspot.sh scripts/start_kiosk.sh \
            pi-server/certs/generate_certs.sh

      - name: Set up Java (for ktlint)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Lint Kotlin (Android sources)
        run: |
          curl -sL https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint -o /tmp/ktlint
          chmod +x /tmp/ktlint
          cd android
          # Full tree is ktlint-clean locally; CI path globs formatted packages.
          /tmp/ktlint --relative --editorconfig=.editorconfig \
            "app/src/main/kotlin/com/kidsgalaxy/*.kt" \
            "app/src/main/kotlin/com/kidsgalaxy/data/**/*.kt" \
            "app/src/main/kotlin/com/kidsgalaxy/network/**/*.kt" \
            "app/src/main/kotlin/com/kidsgalaxy/ui/theme/**/*.kt" \
            "app/src/main/kotlin/com/kidsgalaxy/utils/**/*.kt" \
            "app/src/main/kotlin/com/kidsgalaxy/ui/DrawingCanvas.kt" \
            "app/src/main/kotlin/com/kidsgalaxy/ui/PlanetDrawerScreen.kt"

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: pi-server
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pi-server/requirements.txt
            pi-server/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=main --cov-report=term-missing --cov-report=xml:coverage-unit.xml
      - name: Upload unit coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: pi-server/coverage-unit.xml
          if-no-files-found: ignore

  integration-tests:
    name: Integration tests (end-to-end)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: pi-server
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pi-server/requirements.txt
            pi-server/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run integration tests
        run: pytest tests/integration/ -v --cov=main --cov-report=term-missing --cov-report=xml:coverage-integration.xml --cov-fail-under=50
      - name: Upload integration coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-integration
          path: pi-server/coverage-integration.xml
          if-no-files-found: ignore

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Build pi-server image (production deps only)
        run: docker build -t kids-galaxy-pi-server:ci ./pi-server
      - name: Smoke-test the image
        run: |
          docker run -d --name kg-test -p 8000:8000 kids-galaxy-pi-server:ci
          sleep 3
          curl -sf http://localhost:8000/health | grep -q '"status":"ok"'
          docker stop kg-test
          docker rm kg-test

  android-sources:
    name: Android sources present
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Check Android kiosk sources
        run: |
          test -f android/app/src/main/kotlin/com/kidsgalaxy/MainActivity.kt
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/kidsgalaxy/DeviceAdminReceiver.kt
          echo "Android kiosk sources present."
