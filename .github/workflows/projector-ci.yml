name: Projector CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  javascript-syntax:
    name: Projector JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Parse projector ES modules
        run: |
          node --version
          for file in pi-server/static/galaxy.js pi-server/static/projector/*.js; do
            echo "Checking ${file}"
            node --input-type=module --check < "${file}"
          done
      - name: Keep projector offline
        run: |
          if grep -rnE "https?://" \
              pi-server/static/index.html \
              pi-server/static/galaxy.js \
              pi-server/static/projector/; then
            echo "::error::Projector runtime must remain fully self-hosted."
            exit 1
          fi

  browser-smoke:
    name: Manifest-driven WebGL acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pi-server/requirements.txt
            pi-server/requirements-dev.txt
            pi-server/requirements-projector.txt
      - name: Install projector smoke dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pi-server/requirements-projector.txt
          python -m playwright install --with-deps chromium
      - name: Exercise core manifest projector contract
        run: python scripts/check_projector.py
      - name: Verify tablet drawing manifests drive layered embossed sphere strokes
        run: python scripts/check_manifest_stroke_projection.py
      - name: Verify projector WebGL drives preview and PDF exports
        run: python scripts/check_webgl_export_snapshot.py
      - name: Verify exported planet snapshots stay centred and unclipped
        run: python scripts/check_projector_snapshot_framing.py
      - name: Verify the projector keeps animating after publishing previews
        run: python scripts/check_projector_live_after_snapshot.py
      - name: Verify tablet-selected Saturn ring colors
        run: python scripts/check_ring_color_fidelity.py
      - name: Verify astronaut WebGL options
        run: python scripts/check_spherical_projection_and_astronauts.py
      - name: Upload rendered comparison frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planet-render-comparison
          path: artifacts/*.png
          if-no-files-found: warn
