name: Projector CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  javascript-syntax:
    name: Projector JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Parse projector ES modules
        run: |
          node --version
          for file in pi-server/static/galaxy.js pi-server/static/projector/*.js; do
            echo "Checking ${file}"
            node --input-type=module --check < "${file}"
          done
      - name: Keep projector offline
        run: |
          if grep -rnE "https?://" \
              pi-server/static/index.html \
              pi-server/static/galaxy.js \
              pi-server/static/projector/; then
            echo "::error::Projector runtime must remain fully self-hosted."
            exit 1
          fi

  browser-smoke:
    name: Sculpted kid-design WebGL acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pi-server/requirements.txt
            pi-server/requirements-dev.txt
      - name: Install projector smoke dependencies
        run: |
          python -m pip install --upgrade pip
          # The browser harness uses httpx directly as a tiny external client;
          # the application test suite intentionally uses the separate httpx2
          # package for Starlette TestClient compatibility.
          pip install -r pi-server/requirements-dev.txt \
            "httpx==0.28.1" "playwright==1.54.0"
          python -m playwright install --with-deps chromium
      - name: Exercise core projector smoke contract
        run: python scripts/check_projector.py
      - name: Verify projector WebGL drives preview and PDF exports
        run: python scripts/check_webgl_export_snapshot.py
      # Publishing a preview must not stop the galaxy. Every earlier check here
      # asserts scene state, and the freeze this guards against left the scene
      # graph perfect while the renderer drew to an offscreen target - visible
      # only in the frames actually reaching the canvas.
      - name: Verify the projector keeps animating after publishing previews
        run: python scripts/check_projector_live_after_snapshot.py
      # One script owns planet appearance. It replaces check_latitude_band_projection,
      # and before that check_sculpted_renderer, check_artwork_coverage,
      # check_stroke_wrap, check_area_fill_latitude_projection and
      # check_explicit_body_color. Each was replaced rather than repaired for the
      # same reason: it pinned the appearance being changed. The latest of those
      # asserted "every latitude is one colour right around the planet", which a
      # crooked line now has to violate by design.
      - name: Verify the child's strokes wrap the planet keeping their shape
        run: python scripts/check_drawing_projection.py
      - name: Verify tablet-selected Saturn ring colors
        run: python scripts/check_ring_color_fidelity.py
      - name: Verify astronaut WebGL options
        run: python scripts/check_spherical_projection_and_astronauts.py
      - name: Upload rendered comparison frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planet-render-comparison
          path: artifacts/*.png
          if-no-files-found: warn
