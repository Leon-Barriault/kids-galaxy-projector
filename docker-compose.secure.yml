services:
  pi-server:
    image: kids-galaxy-pi-server:${ROOM_IMAGE_TAG:-room}
    build:
      context: ./pi-server
      args:
        ROOM_VERSION: ${ROOM_VERSION:-dev}
    network_mode: host
    command:
      - uvicorn
      - main:app
      - --host
      - 127.0.0.1
      - --port
      - "8000"
    environment:
      UPLOAD_DIR: /app/uploads
      STATE_DIR: /app/state
      STATIC_DIR: /app/static
      PORT: "8443"
      ADVERTISE: "true"
      ADVERTISE_SCHEME: https
      AUTHORIZATION_ENABLED: "true"
      TRUSTED_ROLE_PROXY_HOSTS: 127.0.0.1,::1
      GALAXY_NAME: ${GALAXY_NAME:-Kids Galaxy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./pi-server/uploads:/app/uploads
      - ./pi-server/state:/app/state
    restart: unless-stopped

  mtls-gateway:
    image: nginx:stable-alpine
    network_mode: host
    depends_on:
      pi-server:
        condition: service_healthy
    volumes:
      - ./deployment/nginx/kids-galaxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./pi-server/certs:/etc/nginx/certs:ro
    restart: unless-stopped
