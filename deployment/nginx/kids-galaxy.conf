# mTLS edge for field deployments.
#
# FastAPI listens only on 127.0.0.1:8000 in secure mode. This gateway is the
# only tablet-facing listener. It verifies the project CA, derives an API role
# from the client certificate OU, and overwrites every trusted header so a
# remote caller cannot choose its own role.

map $ssl_client_s_dn $kids_galaxy_role {
    default "";
    ~*OU=kid kid;
    ~*OU=manager manager;
}

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_client_certificate /etc/nginx/certs/ca.crt;
    ssl_verify_client optional;
    ssl_verify_depth 2;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Kids-Galaxy-Proxy mtls-gateway;
        proxy_set_header X-Kids-Galaxy-Client-Verified $ssl_client_verify;
        proxy_set_header X-Kids-Galaxy-Role $kids_galaxy_role;

        # Per-tablet identity for the upload cooldown. Every request through
        # this proxy reaches FastAPI from 127.0.0.1, so without this the whole
        # classroom shares one rate-limit bucket and the first kid to send a
        # planet locks out the rest. The certificate serial is unique per
        # issued tablet certificate and contains no personal data.
        proxy_set_header X-Kids-Galaxy-Client-Id $ssl_client_serial;

        # SSE must leave the proxy immediately rather than waiting for buffers.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
