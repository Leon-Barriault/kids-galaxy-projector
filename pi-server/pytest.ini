[pytest]
# Ensure pi-server/ is on sys.path so `import main` works in nested test packages
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# importlib import mode lets two suites hold a same-named module
# (tests/unit/api/test_authorization.py and tests/integration/test_authorization.py)
# without needing __init__.py files. Under the default "prepend" mode a plain
# `pytest tests/` aborts during collection with a duplicate-basename error, so
# the suites could only be run one directory at a time - which is exactly how a
# whole-suite regression hides.
addopts = -v --tb=short --import-mode=importlib
filterwarnings =
    ignore::DeprecationWarning

markers =
    unit: pure unit tests (no HTTP / no full app)
    integration: API and end-to-end integration tests
