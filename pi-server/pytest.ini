[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning

# Markers so CI can select suites explicitly
markers =
    unit: pure unit tests (no HTTP / no full app)
    integration: API and end-to-end integration tests
