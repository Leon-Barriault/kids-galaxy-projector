<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <!-- Served locally; avoids a favicon 404 on every projector load. -->
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <style>
    /* No remote font import: the field deployment is an offline Pi hotspot.
       We use a rounded system font stack so the page renders with zero network. */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      overflow: hidden;
      background: #000;
      font-family: 'Nunito', 'Baloo 2', 'Comic Sans MS', system-ui,
        -apple-system, 'Segoe UI', Roboto, sans-serif;
      cursor: none;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
    }

    #ui {
      position: absolute;
      top: 28px;
      left: 32px;
      color: #fff;
      pointer-events: none;
      z-index: 10;
      max-width: min(520px, 70vw);
    }

    #badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, rgba(79, 195, 247, 0.25), rgba(255, 213, 79, 0.2));
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 999px;
      padding: 8px 18px;
      margin-bottom: 14px;
      backdrop-filter: blur(8px);
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    #badge .emoji { font-size: 1.25rem; }

    #planet-name {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 900;
      line-height: 1.15;
      opacity: 0;
      transform: translateY(12px) scale(0.96);
      transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      text-shadow:
        0 0 12px rgba(79, 195, 247, 0.9),
        0 0 28px rgba(255, 213, 79, 0.5),
        0 4px 12px rgba(0, 0, 0, 0.6);
    }

    #planet-name.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    #planet-name.celebrate {
      animation: name-pop 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes name-pop {
      0%   { transform: scale(0.6); opacity: 0; }
      60%  { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); }
    }

    #status {
      margin-top: 10px;
      font-size: clamp(1rem, 2vw, 1.25rem);
      font-weight: 600;
      color: #dce9ff;
      opacity: 0.9;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
    }

    #celebration {
      position: absolute;
      left: 50%;
      top: 18%;
      transform: translateX(-50%) scale(0.8);
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      text-align: center;
      transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #celebration.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    #celebration .burst {
      font-size: clamp(2.5rem, 6vw, 4rem);
      filter: drop-shadow(0 0 16px rgba(255, 213, 79, 0.9));
      animation: spin-slow 6s linear infinite;
    }

    #celebration .msg {
      margin-top: 8px;
      font-size: clamp(1.4rem, 3.5vw, 2.2rem);
      font-weight: 900;
      color: #fff;
      text-shadow:
        0 0 16px rgba(255, 213, 79, 0.95),
        0 0 32px rgba(79, 195, 247, 0.7),
        0 4px 12px rgba(0, 0, 0, 0.7);
    }

    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    #hint {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
      font-weight: 700;
      font-size: clamp(0.9rem, 1.8vw, 1.15rem);
      color: rgba(255, 255, 255, 0.75);
      background: rgba(10, 14, 42, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      padding: 10px 22px;
      backdrop-filter: blur(6px);
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      white-space: nowrap;
    }

    #sparkles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 15;
    }

    .sparkle {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      animation: sparkle-fall 1.8s ease-out forwards;
      box-shadow: 0 0 12px currentColor;
    }

    @keyframes sparkle-fall {
      0%   { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
    }
    /* The system cursor stays hidden on the wall; ShuttlePointer.js draws this
       shuttle instead while a mouse is moving. Its nose is the hotspot. */
    #shuttle-pointer {
      position: fixed;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      pointer-events: none;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    #shuttle-pointer.visible { opacity: 1; }

    #shuttle-pointer .ship {
      position: absolute;
      left: -20px;
      top: -2px;
      width: 40px;
      height: 62px;
      transform-origin: 20px 2px;
      filter: drop-shadow(0 0 5px rgba(79, 195, 247, 0.85));
    }

    #shuttle-pointer .flame {
      transform-origin: 20px 47px;
      transform: scaleY(0.35);
      opacity: 0.55;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    #shuttle-pointer.thrusting .flame {
      transform: scaleY(1);
      opacity: 1;
      animation: shuttle-flicker 0.12s infinite alternate;
    }

    @keyframes shuttle-flicker {
      from { transform: scaleY(0.85); }
      to { transform: scaleY(1.12); }
    }

    @media (prefers-reduced-motion: reduce) {
      #shuttle-pointer.thrusting .flame { animation: none; }
    }
  </style>
</head>
<body>
  <div id="ui">
    <div id="badge"><span class="emoji">🚀</span><span id="badge-label"></span></div>
    <div id="planet-name"></div>
    <div id="status"></div>
  </div>

  <div id="celebration" aria-hidden="true">
    <div class="burst">🌟</div>
    <div class="msg"></div>
  </div>

  <div id="hint"></div>
  <div id="sparkles"></div>
  <div id="canvas-container"></div>
  <!-- Follows the mouse on the wall; see projector/ShuttlePointer.js. -->
  <div id="shuttle-pointer" aria-hidden="true">
    <svg class="ship" viewBox="0 0 40 62" width="40" height="62">
      <g class="flame">
        <ellipse cx="20" cy="54" rx="6" ry="8" fill="#ff8f00" />
        <ellipse cx="20" cy="52" rx="3" ry="5" fill="#ffe082" />
      </g>
      <path d="M20 16 L36 46 L20 42 L4 46 Z" fill="#cfd8e3" stroke="#22304d" stroke-width="1.5" stroke-linejoin="round" />
      <rect x="14.5" y="44" width="4" height="4" rx="1" fill="#607d8b" />
      <rect x="21.5" y="44" width="4" height="4" rx="1" fill="#607d8b" />
      <path d="M20 2 C26 10 27 21 27 34 L27 45 L13 45 L13 34 C13 21 14 10 20 2 Z" fill="#ffffff" stroke="#22304d" stroke-width="1.5" stroke-linejoin="round" />
      <path d="M20 2 C23 6 24.6 9.5 25.2 13 L14.8 13 C15.4 9.5 17 6 20 2 Z" fill="#22304d" />
      <rect x="13.8" y="35" width="12.4" height="3" fill="#e53935" />
      <circle cx="20" cy="22" r="3.4" fill="#4fc3f7" stroke="#22304d" stroke-width="1.2" />
    </svg>
  </div>

  <!-- Three.js is vendored locally (static/vendor) so the projector works on a
       fully offline Pi hotspot. See static/vendor/THREE_LICENSE.txt (MIT). -->
  <script type="importmap">
  {
    "imports": {
      "three": "/static/vendor/three.module.js",
      "three/addons/": "/static/vendor/jsm/"
    }
  }
  </script>
  <script type="module" src="/static/galaxy.js"></script>
</body>
</html>
