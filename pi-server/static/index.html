<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kids Galaxy Projector</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #000;
      font-family: system-ui, sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      text-shadow: 0 0 8px #00f, 0 0 12px #0ff;
      pointer-events: none;
      z-index: 10;
    }
    #planet-name {
      font-size: 2rem;
      font-weight: 700;
      opacity: 0;
      transition: opacity 1s ease;
    }
    #planet-name.visible {
      opacity: 1;
    }
    #status {
      font-size: 1rem;
      margin-top: 8px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div id="planet-name">Waiting for a planet...</div>
    <div id="status">Kids Galaxy Projector ready</div>
  </div>
  <div id="canvas-container"></div>

  <!-- Three.js r170+ (CDN) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script type="module" src="/static/galaxy.js"></script>
</body>
</html>
