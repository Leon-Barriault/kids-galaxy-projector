# Ruff lint config for pi-server (FastAPI)
target-version = "py312"
line-length = 100

[lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # bugbear
  "SIM",  # simplify
  "RUF",  # ruff-specific
]
ignore = [
  "B008",   # FastAPI Depends/File/Form in defaults is intentional
  "RUF012", # mutable class vars
]

[lint.per-file-ignores]
"tests/**" = [
  "SLF001",  # tests may inspect private helpers (_last_upload)
  "S101",    # assert is fine in tests
]

[lint.isort]
known-first-party = ["main"]

[format]
quote-style = "double"
indent-style = "space"
